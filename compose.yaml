services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: espresso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: espresso_budget
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
  
volumes:
  db-data: